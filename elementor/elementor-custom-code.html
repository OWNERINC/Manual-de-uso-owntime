<!--
  ================================================================
  OWN TIME HOME CLUB — Diretório Digital
  Custom Code para Elementor
  Cola em: Elementor > Site Settings > Custom Code > Before </body>
  ================================================================
-->

<!-- GSAP + ScrollTrigger -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- Lucide Icons (para os ícones nos accordions) -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {

  /* ──────────────────────────────────────────────
     1. Lucide — inicializa todos os data-lucide="..."
     Adicione <i data-lucide="nome-do-icone"></i>
     em qualquer HTML Widget do Elementor.
  ────────────────────────────────────────────── */
  if (typeof lucide !== 'undefined') {
    lucide.createIcons();
  }

  /* ──────────────────────────────────────────────
     2. Hero — linha de scroll (scrub)
     Adicione um HTML Widget na seção hero com:
       <span class="owntime-scroll-line"></span>
     O script abaixo faz ela encolher no scroll.
  ────────────────────────────────────────────── */
  if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
    gsap.registerPlugin(ScrollTrigger);

    const scrollLine = document.querySelector('.owntime-scroll-line');
    if (scrollLine) {
      gsap.to(scrollLine, {
        scaleX: 0,
        transformOrigin: 'right center',
        ease: 'none',
        scrollTrigger: {
          trigger: '.owntime-hero',
          start: 'top top',
          end: 'bottom top',
          scrub: true
        }
      });
    }
  }

  /* ──────────────────────────────────────────────
     3. Floating Action — aparece após 12% de scroll
     Adicione um HTML Widget em qualquer lugar da
     página com id="owntime-floating-action" e o
     HTML do botão (ver elementor-floating-snippet.html).
  ────────────────────────────────────────────── */
  const floatingEl = document.getElementById('owntime-floating-action');
  if (floatingEl && typeof ScrollTrigger !== 'undefined') {
    ScrollTrigger.create({
      trigger: 'body',
      start: '12% top',
      onEnter:     () => floatingEl.classList.add('is-visible'),
      onLeaveBack: () => floatingEl.classList.remove('is-visible')
    });
  }

  /* ──────────────────────────────────────────────
     4. Reveals de seção (IntersectionObserver)
     Adicione a classe CSS "owntime-reveal" nos
     widgets que devem aparecer ao entrar no viewport.
     Via: Advanced > CSS Classes no Elementor.

     Para stagger, adicione também:
       owntime-delay-1  (0.09s)
       owntime-delay-2  (0.18s)
       owntime-delay-3  (0.27s)
  ────────────────────────────────────────────── */
  const delayMap = {
    'owntime-delay-1': 0.09,
    'owntime-delay-2': 0.18,
    'owntime-delay-3': 0.27,
    'owntime-delay-4': 0.36
  };

  // Aplica transition-delay para stagger
  document.querySelectorAll('.owntime-reveal').forEach(el => {
    Object.entries(delayMap).forEach(([cls, delay]) => {
      if (el.classList.contains(cls)) {
        el.style.transitionDelay = delay + 's';
      }
    });
  });

  const vh = window.innerHeight;
  const toObserve = [];

  document.querySelectorAll('.owntime-reveal').forEach(el => {
    const rect = el.getBoundingClientRect();
    // Não anima elementos já visíveis no carregamento
    if (rect.top < vh) {
      el.classList.add('is-visible');
      return;
    }
    toObserve.push(el);
  });

  if (toObserve.length) {
    const observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        entry.target.addEventListener('transitionend', function () {
          entry.target.style.transitionDelay = '';
        }, { once: true });
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.05 });

    toObserve.forEach(el => observer.observe(el));

    // Fallback: revela tudo após 3s caso o observer não dispare
    setTimeout(function () {
      document.querySelectorAll('.owntime-reveal:not(.is-visible)').forEach(el => {
        el.classList.add('is-visible');
      });
    }, 3000);
  }

});
</script>
